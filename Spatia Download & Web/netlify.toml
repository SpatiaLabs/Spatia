# Spatia website — Netlify configuration.
# The site itself is static (index.html + js/ + css/ + web/). The only
# serverless piece is the "Report a problem" endpoint in netlify/functions/,
# which forwards reports to Resend. Declaring it here is what makes Netlify
# build and route it at /.netlify/functions/report instead of publishing the
# source file as static content.
#
# Requires the following environment variables in the Netlify site:
#   RESEND_API_KEY  - Resend API key used to send the report email
#   REPORT_FROM     - verified sender address, e.g. "Spatia Website <no-reply@domain>"
# Optional: REPORT_TO, REPORT_SUBJECT (defaults live in netlify/functions/report.js)

[build]
  publish = "."
  functions = "netlify/functions"